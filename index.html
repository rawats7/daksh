    /* reset & base */
    * {

      padding: 0;

    }

    /* card glow & vignette */
    .surface-vignette {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .card-glow {
      position: relative;
      background: rgba(18, 18, 24, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 2rem;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(255, 215, 0, 0.08),
        0 0 80px rgba(255, 215, 0, 0.04),
        inset 0 0 60px rgba(255, 215, 0, 0.02);
      max-width: 420px;
      width: 100%;
      padding: 2rem 1.5rem;
      text-align: center;
      transition: box-shadow 0.3s;
    }

    .card-glow:hover {
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(255, 215, 0, 0.12),
        0 0 100px rgba(255, 215, 0, 0.06);
    }

    /* logo circle - smaller */
    .logo-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1a1a24, #0d0d12);
      border: 2px solid rgba(255, 215, 0, 0.25);
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.1),
        inset 0 0 30px rgba(255, 215, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: pulse-glow 3s ease-in-out infinite;
      position: relative;
    }

    @keyframes pulse-glow {
      0%, 100% { 
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.1), inset 0 0 30px rgba(255, 215, 0, 0.05);
      }
      50% { 
        box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), inset 0 0 50px rgba(255, 215, 0, 0.08);
      }
    }

    /* placeholder image inside circle */
    .logo-placeholder {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: #d9a821;
      font-weight: 900;
      font-family: 'Courier New', monospace;
      background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.05), transparent);
      border-radius: 50%;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    /* you can replace the placeholder with an <img> tag */
    .logo-placeholder img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 50%;
    }

    /* typography - hacker font */
    .text-gradient-gold {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      font-family: 'Courier New', 'Fira Code', monospace;
      background: linear-gradient(135deg, #f9e05d, #d4a017, #b8860b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-top: 1rem;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
      text-transform: uppercase;
    }

    .divider-gold {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4a017, transparent);
      margin: 0.75rem auto 1rem;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);

    .sub-text {

      font-size: 0.9rem;

    /* feature grid */

      gap: 0.75rem;
      margin-top: 1.5rem;

    .feature-item {

      border: 1px solid rgba(255, 215, 0, 0.08);
      border-radius: 0.75rem;
      padding: 0.75rem 0.25rem;
      backdrop-filter: blur(2px);
      transition: border-color 0.2s;

    .feature-item:hover {
      border-color: rgba(255, 215, 0, 0.2);
    }

    .feature-item svg {
      width: 20px;
      height: 20px;
      color: #d9a821;

      display: block;
    }

    .feature-item p {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: #8888a0;
      margin-top: 0.4rem;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* timer box */
    .timer-box {
      margin-top: 1.5rem;
      border: 1px solid rgba(255, 215, 0, 0.08);
      border-radius: 1rem;
      padding: 0.1rem 0.5rem 0.75rem;
      background: rgba(0, 0, 0, 0.2);
    }

    .timer-label {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      color: #d9a821;
      text-transform: uppercase;
      font-weight: 600;
      padding-top: 0.75rem;
      opacity: 0.9;
    }

    .timer-display {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 0.75rem;
      padding: 0.9rem 0.5rem;
      margin-top: 0.5rem;
      border: 1px solid rgba(255, 215, 0, 0.05);
    }

    .timer-number {
      font-size: 3.2rem;
      font-weight: 800;
      color: #f0f0f5;
      letter-spacing: 0.04em;
      line-height: 1;
      font-family: 'Courier New', monospace;
    }

    .timer-unit {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      color: #707088;
      margin-top: 0.2rem;
      text-transform: uppercase;
    }

    /* responsive */
    @media (max-width: 440px) {
      .card-glow {
        padding: 1.5rem 1rem;

      padding: 0 2px;
      line-height: 1;
    }
    .lovable-badge-mock .close-badge:hover {
      color: #ccc;
    }
    .hide-badge {
      display: none !important;
    }
  </style>

  <script>
    (function() {
      // countdown 30s
      let seconds = 30;
      const display = document.getElementById('countdownNumber');
      if (display) {
        const interval = setInterval(() => {
          seconds -= 1;
          if (seconds < 0) seconds = 0;
          display.textContent = seconds;
          if (seconds === 0) clearInterval(interval);
        }, 1000);
      }

      // lovable badge close
      const closeBtn = document.getElementById('lovableCloseBtn');
      const badge = document.getElementById('lovable-badge');
      if (closeBtn && badge) {
        closeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          badge.style.transition = 'opacity 0.2s, transform 0.2s';
          badge.style.opacity = '0';
          badge.style.transform = 'scale(0.92)';
          setTimeout(() => {
            badge.style.display = 'none';
          }, 200);
        });
      }

      // hide in iframe/puppeteer
      if (window.self !== window.top || navigator.userAgent.includes('puppeteer')) {
        if (badge) badge.classList.add('hide-badge');
      }
    })();
